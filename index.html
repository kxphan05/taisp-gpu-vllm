<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk to Qwen</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e2e2e6;
    --text: #1a1a1e;
    --muted: #6b6b76;
    --accent: #6c5ce7;
    --accent-text: #ffffff;
    --user-bubble: #6c5ce7;
    --assistant-bubble: #eeeef2;
    --error: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --panel: #1e1e24;
      --border: #2e2e36;
      --text: #ececf1;
      --muted: #9a9aa5;
      --assistant-bubble: #2a2a32;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body { display: flex; flex-direction: column; }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: var(--accent-text);
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--assistant-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: flex-start;
    background: transparent;
    color: var(--error);
    border: 1px solid var(--error);
  }

  #empty-hint {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  form#composer {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  form#composer textarea {
    flex: 1;
    resize: none;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    max-height: 140px;
  }
  form#composer button {
    padding: 0 18px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  form#composer button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<header><h1>Talk to Qwen</h1></header>

<div id="chat">
  <div id="empty-hint">Say hello.</div>
</div>

<form id="composer">
  <textarea id="message-input" rows="1" placeholder="Message the model..." autofocus></textarea>
  <button type="submit" id="send-btn">Send</button>
</form>

<script>
  const ENDPOINT = "http://100.76.19.104:8000/v1/chat/completions";
  const MODEL = "Qwen/Qwen2.5-7B-Instruct";
  const HISTORY_KEY = "talktoqwen.history.v1";

  const els = {
    chat: document.getElementById("chat"),
    emptyHint: document.getElementById("empty-hint"),
    composer: document.getElementById("composer"),
    messageInput: document.getElementById("message-input"),
    sendBtn: document.getElementById("send-btn"),
  };

  function loadHistory() {
    try {
      return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    } catch {
      return [];
    }
  }
  function saveHistory(history) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch {}
  }

  let history = loadHistory();

  function renderHistory() {
    els.chat.innerHTML = "";
    if (history.length === 0) {
      els.chat.appendChild(els.emptyHint);
      return;
    }
    for (const msg of history) appendBubble(msg.role, msg.content);
    els.chat.scrollTop = els.chat.scrollHeight;
  }

  function appendBubble(role, content) {
    if (els.emptyHint.parentNode) els.emptyHint.remove();
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = content;
    els.chat.appendChild(div);
    els.chat.scrollTop = els.chat.scrollHeight;
    return div;
  }

  els.messageInput.addEventListener("input", () => {
    els.messageInput.style.height = "auto";
    els.messageInput.style.height = Math.min(els.messageInput.scrollHeight, 140) + "px";
  });

  els.messageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      els.composer.requestSubmit();
    }
  });

  els.composer.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = els.messageInput.value.trim();
    if (!text) return;

    els.messageInput.value = "";
    els.messageInput.style.height = "auto";

    history.push({ role: "user", content: text });
    saveHistory(history);
    appendBubble("user", text);

    const assistantBubble = appendBubble("assistant", "");
    els.sendBtn.disabled = true;

    try {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: MODEL,
          messages: history,
          stream: true,
        }),
      });

      if (!res.ok) {
        const bodyText = await res.text().catch(() => "");
        throw new Error(`HTTP ${res.status} ${res.statusText}${bodyText ? " — " + bodyText.slice(0, 300) : ""}`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let full = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith("data:")) continue;
          const payload = trimmed.slice(5).trim();
          if (payload === "[DONE]") continue;
          try {
            const json = JSON.parse(payload);
            const delta = json?.choices?.[0]?.delta?.content;
            if (delta) {
              full += delta;
              assistantBubble.textContent = full;
              els.chat.scrollTop = els.chat.scrollHeight;
            }
          } catch {}
        }
      }

      if (!full) full = "(empty response)";
      assistantBubble.textContent = full;
      history.push({ role: "assistant", content: full });
      saveHistory(history);
    } catch (err) {
      assistantBubble.remove();
      let hint = "";
      if (err instanceof TypeError) {
        hint = " (often CORS or mixed-content blocking — see README)";
      }
      appendBubble("error", "Request failed: " + err.message + hint);
    } finally {
      els.sendBtn.disabled = false;
      els.messageInput.focus();
    }
  });

  renderHistory();
</script>

</body>
</html>
